name: Build Base Image

on:
  workflow_call:
    outputs:
      image:
        description: "Full image reference"
        value: ${{ jobs.build.outputs.image }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pg-what-is-happening-test

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: testing
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.result.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate dashboard
        run: sh scripts/validate-dashboard.sh

      - name: Calculate content hash
        id: meta
        run: |
          test -f .tmux.conf || : > .tmux.conf
          CONTENT_HASH=$(sha256sum Dockerfile .tmux.conf scripts/container-entrypoint.sh | sha256sum | cut -c1-16)
          IMAGE_BASE="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}"

          echo "image_cached=${IMAGE_BASE}:${CONTENT_HASH}" >> "$GITHUB_OUTPUT"
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check cache
        id: check
        run: |
          if docker manifest inspect ${{ steps.meta.outputs.image_cached }} > /dev/null 2>&1; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          pwd
          ls
          ./Shfile.sh make-image

      - name: Push to cache
        if: steps.check.outputs.cache_hit != 'true'
        run: |
          docker tag ${{ env.IMAGE_NAME }} ${{ steps.meta.outputs.image_cached }}
          docker push ${{ steps.meta.outputs.image_cached }}

      - name: Set outputs
        id: result
        run: |
          echo "image=${{ steps.meta.outputs.image_cached }}" >> "$GITHUB_OUTPUT"
